<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Governance Gates</title>
  <desc id="desc">Visual summary of governance checks and review gates before shipping code.</desc>
  <rect width="1400" height="760" fill="#F5F1E8"/>
  <rect x="120" y="120" width="1160" height="520" rx="24" fill="#1F3342"/>

  <g fill="#F8FAFB" font-family="Arial, sans-serif" font-size="30">
    <text x="180" y="200">Pre-Ship Gates</text>
    <text x="180" y="280">1. governance:check</text>
    <text x="180" y="340">2. events:guard</text>
    <text x="180" y="400">3. test + type-check</text>
    <text x="180" y="460">4. diff review</text>
    <text x="180" y="520">5. final human decision</text>
  </g>

  <g>
    <circle cx="1040" cy="300" r="70" fill="#D2E5D4"/>
    <path d="M1008 302 L1030 324 L1074 278" stroke="#1F6B3D" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="980" y="420" font-family="Arial, sans-serif" font-size="26" fill="#F8FAFB">Ship with confidence</text>
  </g>
</svg>
