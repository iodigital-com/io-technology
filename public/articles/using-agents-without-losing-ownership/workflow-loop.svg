<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Idea to Ticket Workflow Loop</title>
  <desc id="desc">Diagram showing idea refinement, planning, tickets, implementation, and governance checks.</desc>
  <rect width="1400" height="900" fill="#F6F4EE"/>

  <g font-family="Arial, sans-serif" fill="#1F3342" font-size="28" text-anchor="middle">
    <circle cx="700" cy="180" r="110" fill="#DCE8EE"/>
    <text x="700" y="170">Idea</text>
    <text x="700" y="205">Refinement</text>

    <circle cx="1010" cy="335" r="110" fill="#E8E0D4"/>
    <text x="1010" y="325">Execution</text>
    <text x="1010" y="360">Plan</text>

    <circle cx="1010" cy="565" r="110" fill="#DCE8EE"/>
    <text x="1010" y="555">Actionable</text>
    <text x="1010" y="590">Tickets</text>

    <circle cx="700" cy="720" r="110" fill="#E8E0D4"/>
    <text x="700" y="710">One Ticket</text>
    <text x="700" y="745">At a Time</text>

    <circle cx="390" cy="565" r="110" fill="#DCE8EE"/>
    <text x="390" y="555">Governance</text>
    <text x="390" y="590">Checks</text>

    <circle cx="390" cy="335" r="110" fill="#E8E0D4"/>
    <text x="390" y="325">Diff</text>
    <text x="390" y="360">Review</text>
  </g>

  <g stroke="#1F3342" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M790 220 L920 290"/>
    <path d="M1010 445 L1010 455"/>
    <path d="M920 610 L790 680"/>
    <path d="M610 680 L480 610"/>
    <path d="M390 455 L390 445"/>
    <path d="M480 290 L610 220"/>
  </g>
</svg>
